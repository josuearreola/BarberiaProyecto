<app-social-sidebar></app-social-sidebar>

<!-- Contenido principal de la página de inicio -->
<div class="main-content">
  <section id="inicio">
    <app-hero></app-hero>
  </section>

  <section id="servicios">
    <app-services></app-services>
  </section>

  <section id="agendar">
    <app-booking></app-booking>
  </section>

  <section id="galeria" class="section">
    <div class="section-container">
      <h2>Galería</h2>
      <p>Selección de cortes reales que mas piden nuestros clientes.</p>
      <div class="gallery-grid">
        <div class="gallery-card">
          <div class="gallery-image fade-low" aria-label="Low fade clasico"></div>
          <div class="gallery-info">
            <h4>Low Fade Clásico</h4>
            <span>Líneas limpias y acabado natural</span>
          </div>
        </div>
        <div class="gallery-card">
          <div class="gallery-image mid-fade" aria-label="Mid fade moderno"></div>
          <div class="gallery-info">
            <h4>Mid Fade Moderno</h4>
            <span>Transición marcada y volumen arriba</span>
          </div>
        </div>
        <div class="gallery-card">
          <div class="gallery-image crop-texture" aria-label="Crop texturizado"></div>
          <div class="gallery-info">
            <h4>Crop Texturizado</h4>
            <span>Textura mate con fleco corto</span>
          </div>
        </div>
        <div class="gallery-card">
          <div class="gallery-image slick-back" aria-label="Slick back clasico"></div>
          <div class="gallery-info">
            <h4>Slick Back Clásico</h4>
            <span>Peinado pulido con brillo controlado</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
